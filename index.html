<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>movie project</title>
    <link rel="stylesheet" href="/css/reset.css" type="text/css" />
    <link rel="stylesheet" href="/css/style.css" type="text/css" />
    <link rel="stylesheet" href="/css/fontello.css">
  </head>
  <body>
    <header>
      <div id="cont_head" class="container">
        <h1 id="title">영화 검색 사이트</h1>
        <div class="search_area">
          <label for="input_search"></label>
          <input
            type="search"
            id="input_search"
            placeholder="영화를 검색하세요"
            name="search"
          />
          <button id="btn_search">검색</button>
        </div>

        <nav>
          <div class="bookmark">
            <!-- <p>북마크 보기</p> -->
          </div>
        </nav>
      </div>
    </header>

    <main>
      <div id="movie_container" class="container">
        <!-- <div class="movies">
          <div alt="movie poster" class="movie_poster"></div>
          <h2 class="movie_title">title</h2>
          <div class="movie_card_bott">
            <p class="movie_aver">vote_average</p>
          </div>
        </div> -->
      </div>
    </main>

    <div class="modal hide">
      <div class="modal_movie_detail">
        <img
          alt="movie poster"
          class="movie_poster_detail"
        />
        <div class="detail_close_btn"> close </div>
        <div class="movie_data_detail">
          <div class="detail_text_area">
            <h3 class="movie_title_detail"></h3>
            <p class="movie_desc"></p>
            <div>
              <i class="icon-star"></i>
              <p class="movie_aver_detail">
              </p>
            </div>

            <p class="movie_date"></p>
          </div>
          <div class="detail_btn_area">
            <button class="bookmark_detail detail_btn "></button>
            <button class="like detail_btn"><i class=" icon-heart-empty" id="ilike"></i></button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>right 어쩌구 저쩌구</p>
    </footer>

    <script src="/js/script.js" type="module"></script>
  </body>
</html>
